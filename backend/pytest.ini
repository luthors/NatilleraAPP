[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --import-mode=importlib
markers =
    auth: Authentication tests
    natillera: Natillera tests
    transaction: Transaction tests
    integration: Integration tests
